<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d38"><title>てのひらの世界</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102d38'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%2356c7cf'/%3E%3Cpath d='M8 14L14 7L23 13L21 22L12 24Z' fill='%2393bb61'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body><header><div><span class="eyebrow">LITTLE WORLD · 08.1</span><h1>てのひらの世界</h1></div><div class="world-stats"><div class="world-clock"><span>世界の経過時間</span><strong id="world-time">0年 0か月</strong></div><div class="population"><span>世界の人口</span><strong id="population">0 <small>人</small></strong></div></div></header>
<main><section class="map" aria-label="世界の地図"><canvas id="world" aria-label="ドラッグで移動、ピンチで拡大。人を置くモードで陸地をタップ。"></canvas><div class="map-label"><span class="live"></span> アソス <span id="seed"></span></div><div class="zoom"><button id="plus" aria-label="拡大">＋</button><button id="minus" aria-label="縮小">−</button><button id="fit" aria-label="初期の表示に戻す">戻す</button></div><div id="message" role="status">「人を置く」を選んで、陸地をタップ</div></section>
<section id="person" class="person" hidden aria-label="選んだ人の状態"><div class="person-title"><strong id="person-name"></strong><button id="close-person" aria-label="状態表示を閉じる">×</button></div><p id="person-action"></p><div class="vitals"><label>HP <meter id="health" min="0" max="100"></meter><span id="health-value"></span></label><label>満腹 <meter id="fullness" min="0" max="100" low="15" high="55" optimum="100"></meter><span id="fullness-value"></span></label></div><small><span id="person-age">20</span>歳 · 満腹0でHPが減少 · 食事 <span id="meals">0</span>回</small><div class="inventory">木材 <b id="wood">0</b>/3　石材 <b id="stone">0</b>/2　家：<b id="home">なし</b></div><div class="family-details">配偶者：<span id="spouse">なし</span><br>親：<span id="parents">なし</span><br>子ども：<span id="children">なし</span></div></section><section class="controls"><div class="terrain-tools"><button id="land" aria-pressed="false">▧ 陸地を描く</button><label id="brush-control" hidden>太さ<select id="brush"><option value="2">細い</option><option value="5" selected>ふつう</option><option value="10">太い</option></select></label></div><div class="tools"><button id="move" class="selected" aria-pressed="true">✥ 見わたす</button><button id="place" aria-pressed="false">＋ 人を置く</button><label>性別<select id="sex"><option value="random">ランダム</option><option value="male">男</option><option value="female">女</option></select></label><label class="age-control">年齢<input id="age" type="number" min="0" max="120" step="1" value="20" inputmode="numeric" aria-label="置く人の年齢（0〜120歳）">歳</label><button id="pause" aria-pressed="false">Ⅱ 一時停止</button></div><div class="bottom"><p>指で移動 · 2本指で拡大縮小 <span>／ 人をタップで状態を見る · 60秒で1年</span></p><div class="file-tools"><button id="save-file">保存</button><button id="load-file">読込</button><input id="load-input" type="file" accept=".json,application/json" hidden><button id="regenerate">↻ 新しい世界</button></div></div></section><p class="family-news" id="family-news" role="status"></p></main><footer><span>木 <i class="wood-key"></i>　石 <i class="stone-key"></i>　食料 <i class="food-key"></i>　海 <i class="sea"></i>　砂浜 <i class="sand"></i>　草原 <i class="grass"></i>　山 <i class="mountain"></i></span><span>食料 <b id="food-count">0</b> · 夫婦 <b id="couples">0</b>組 · 出生 <b id="births">0</b>人 · 家 <b id="houses">0</b>軒 · 死亡 <b id="deaths">0</b>人（老衰 <b id="old-age-deaths">0</b>）</span><span>試作 08.1 · 終わる前に「保存」</span></footer>
<dialog id="load-confirm"><h2>保存した世界に戻す？</h2><p id="load-summary"></p><div><button id="load-cancel">戻る</button><button id="load-yes">読み込む</button></div></dialog><dialog id="confirm"><h2>新しい世界を作る？</h2><p>今の地形と人は消えます。</p><div><button id="cancel">戻る</button><button id="yes">作り直す</button></div></dialog><script type="module" src="./main.js"></script></body></html>
